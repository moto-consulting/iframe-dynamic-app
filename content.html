<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Qlik Embed</title>

  <!-- Qlik JavaScript Loader -->
  <script src="https://ruwacbi.de.qlikcloud.com/resources/assets/external/requirejs/require.js"></script>
  <script src="https://res.cdn.office.net/teams-js/2.13.0/js/MicrosoftTeams.min.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
    }

    [data-theme="dark"] {
      --bg: #1e1e1e;
      --text: #ffffff;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #qlik-container {
      width: 100%;
      height: 100%;
    }

    #loading {
      color: var(--text);
      font-size: 16px;
      text-align: center;
    }

    #error {
      color: #e81123;
      font-size: 14px;
      text-align: center;
      padding: 20px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loading">Loading Qlik Dashboard...</div>
  <div id="qlik-container"></div>
  <div id="error"></div>

  <script>
    // Initialize Teams (optional, for dark/light theme)
    microsoftTeams.app.initialize().then(() => {
      microsoftTeams.app.getContext().then((ctx) => {
        document.body.setAttribute("data-theme", ctx.app.theme || "default");
      });
      microsoftTeams.app.registerOnThemeChangeHandler((theme) => {
        document.body.setAttribute("data-theme", theme);
      });
    }).catch(() => {});

    // Parse appid and sheet from URL
    const params = new URLSearchParams(window.location.search);
    const appId = params.get("appid");
    const sheetId = params.get("sheet");

    if (!appId || !sheetId) {
      document.getElementById("loading").style.display = "none";
      document.getElementById("error").style.display = "block";
      document.getElementById("error").innerText = "Missing appid or sheet parameter in URL.";
      throw new Error("Missing parameters");
    }

    // Load Qlik via RequireJS
    require(["https://ruwacbi.de.qlikcloud.com/resources/js/qlik"], function(qlik) {
      try {
        qlik.setOnError(function (error) {
          console.error("Qlik Error:", error);
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").style.display = "block";
          document.getElementById("error").innerText = "Error loading Qlik content. Please check access permissions.";
        });

        const config = {
          host: "ruwacbi.de.qlikcloud.com",
          prefix: "/",
          port: 443,
          isSecure: true
        };

        const app = qlik.openApp(appId, config);
        app.getObject("qlik-container", sheetId).then(() => {
          document.getElementById("loading").style.display = "none";
        }).catch((err) => {
          console.error("Load object failed:", err);
          document.getElementById("loading").style.display = "none";
          document.getElementById("error").style.display = "block";
          document.getElementById("error").innerText = "Could not load dashboard. Please check app or sheet ID.";
        });
      } catch (err) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "block";
        document.getElementById("error").innerText = "Unexpected error while initializing Qlik.";
        console.error(err);
      }
    });
  </script>
</body>
</html>
